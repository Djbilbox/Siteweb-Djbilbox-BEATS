<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GFUNK 2027">
<meta name="theme-color" content="#140d06">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>GFUNK 2027 Free</title>
<style>
:root{--bg:#140d06;--panel:#241808;--gold:#e8b94a;--gold2:#a77a1e;--pink:#ff4fa3;--ink:#f6e9c6;--dim:#a8957a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-left));gap:8px}
header{display:flex;align-items:center;gap:10px;padding-top:8px}
header img{height:54px;filter:drop-shadow(0 0 8px #e8b94a66)}
h1{margin:0;font-size:18px;letter-spacing:.14em;color:var(--gold);line-height:1.1}
h1 small{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim)}
.preset{background:linear-gradient(#0a0a0a,#171006);border:1px solid var(--gold2);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.preset .nm{flex:1;min-width:0;text-align:center}
.preset .nm b{display:block;font-size:17px;color:#7be8ff;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset .nm span{font-size:11px;color:var(--dim);letter-spacing:.12em}
button{font:inherit;color:var(--ink);background:linear-gradient(#3a2810,#22160a);border:1px solid var(--gold2);border-radius:10px;min-width:44px;height:44px;padding:0 10px;cursor:pointer}
button:active,button.on{background:linear-gradient(#e8b94a,#a77a1e);color:#1a1006}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;background:var(--panel);border:1px solid #4a3412;border-radius:12px;padding:8px 10px}
.macros label{display:flex;flex-direction:column;font-size:10px;letter-spacing:.12em;color:var(--gold);gap:2px}
input[type=range]{width:100%;height:30px;accent-color:var(--gold);margin:0;touch-action:pan-x}
.bar{display:flex;gap:8px;align-items:center}
.bar .sp{flex:1}
.bar .oct{min-width:90px;text-align:center;font-size:12px;color:var(--dim)}
#keys{position:relative;flex:1;min-height:150px;display:flex;background:#000;border:2px solid var(--gold2);border-radius:10px;touch-action:none;overflow:hidden}
.k{position:relative;flex:1;background:linear-gradient(#f9efd2,#e3d19c);border-right:1px solid #6a5a30;touch-action:none}
.k.on{background:linear-gradient(#ffd56a,#e8a73a)}
.bk{position:absolute;top:0;width:6.2%;height:60%;background:linear-gradient(#2a2a2a,#050505);border:1px solid #000;border-radius:0 0 6px 6px;z-index:2;touch-action:none}
.bk.on{background:linear-gradient(#ff7ac0,#d02c80)}
#sheet{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);z-index:9}
#sheet.open{display:flex}
#cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
#cats button{white-space:nowrap;height:36px;font-size:12px}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#list div{padding:13px 8px;border-bottom:1px solid #3a2a12;font-size:15px;display:flex;justify-content:space-between}
#list div.cur{color:#7be8ff}
#list div span{color:var(--dim);font-size:12px}
@media (max-height:480px){
  #app{gap:5px}header{display:none}
  .preset{padding:4px 8px}.preset .nm b{font-size:15px}button{height:36px}
  .macros{gap:2px 10px;padding:4px 10px}.macros label{font-size:9px}input[type=range]{height:20px}
  #keys{min-height:120px}
}
#start{position:fixed;inset:0;z-index:20;background:#140d06f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#start img{width:min(60vw,260px)}
#start button{height:56px;font-size:18px;padding:0 34px;letter-spacing:.12em}
#start p{color:var(--dim);font-size:13px;max-width:320px;margin:0}
</style>
</head>
<body>
<div id="start">
  <img src="hero.png" alt="">
  <h1>GFUNK 2027 <span style="color:var(--pink)">FREE</span><small>HUMPIRE by Djbilbox BEATS</small></h1>
  <button id="go">PLAY</button>
  <p>Synthé West Coast G-Funk, 100 presets. Touche pour démarrer le son (mets le volume et coupe le mode silencieux sur iPhone).</p>
</div>
<div id="app">
  <header><img src="hero.png" alt=""><h1>GFUNK 2027 <span style="color:var(--pink)">FREE</span><small>HUMPIRE by Djbilbox BEATS</small></h1></header>
  <div class="preset">
    <button id="prev">◀</button>
    <div class="nm" id="nameBox"><b id="pname">-</b><span id="pcat">-</span></div>
    <button id="next">▶</button>
    <button id="dice">🎲</button>
    <button id="menu">☰</button>
  </div>
  <div class="macros" id="macros"></div>
  <div class="bar">
    <button id="octd">−</button><div class="oct" id="octl">C3–C5</div><button id="octu">+</button>
    <div class="sp"></div>
    <label style="font-size:10px;color:var(--gold);letter-spacing:.1em">BEND</label>
    <input type="range" id="bend" min="-1" max="1" step="0.01" value="0" style="width:38%">
  </div>
  <div id="keys"></div>
</div>
<div id="sheet"><div id="cats"></div><div id="list"></div><button id="close" style="margin:8px 0">FERMER</button></div>
<script src="app.js"></script>
</body>
</html>
