name: NEON SYNTH 80s 2.0 (macOS)
# macOS universal (arm64 + x86_64) : VST3 + AU + Standalone, .pkg dans un zip, publie en release GitHub.
# Push sur ce workflow ou sur le code NEON = build. Lancement manuel possible (Actions > Run workflow).
on:
  push:
    branches: [claude/blissful-newton-cxepis]
    paths:
      - '.github/workflows/neon-macos.yml'
      - 'NEON_SYNTH_80S/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neon-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: NEON_SYNTH_80S
    env:
      PRODUCT: NEON SYNTH 80s 2.0
      SLUG: NEON_SYNTH_80s_2_Mac
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build VST3, AU, Standalone and the render test
        run: cmake --build build --config Release --parallel 4 --target NeonSynth80s_VST3 NeonSynth80s_AU NeonSynth80s_Standalone NeonTest

      - name: Render test (70 presets, voice modes, state recall)
        run: ./build/NeonTest_artefacts/Release/NeonTest

      - name: Check universal binaries
        run: |
          A=build/NeonSynth80s_artefacts/Release
          lipo -info "$A/VST3/$PRODUCT.vst3/Contents/MacOS/$PRODUCT"
          lipo -info "$A/AU/$PRODUCT.component/Contents/MacOS/$PRODUCT"

      - name: AU validation (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/NeonSynth80s_artefacts/Release/AU/$PRODUCT.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i neon || true
          code=$(auval -a | grep -i "neon" | head -1 | awk '{print $1, $2, $3}')
          [ -n "$code" ] && auval -v $code

      - name: Ad-hoc sign and build the installer package
        run: |
          set -e
          A=build/NeonSynth80s_artefacts/Release
          for b in "$A/VST3/$PRODUCT.vst3" "$A/AU/$PRODUCT.component" "$A/Standalone/$PRODUCT.app"; do
            codesign --force --deep -s - "$b"
          done
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components pkgroot/Applications
          cp -R "$A/VST3/$PRODUCT.vst3" pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R "$A/AU/$PRODUCT.component" pkgroot/Library/Audio/Plug-Ins/Components/
          cp -R "$A/Standalone/$PRODUCT.app" pkgroot/Applications/
          mkdir -p dist/$SLUG
          pkgbuild --root pkgroot --identifier com.djbilboxbeats.neonsynth80s2.pkg --version 2.0.${{ github.run_number }} --install-location / dist/$SLUG/$SLUG.pkg
          cp mac/README_FIRST_MAC.txt dist/$SLUG/README_FIRST.txt
          cp LICENSE.md dist/$SLUG/LICENSE.txt
          cd dist && ditto -c -k --keepParent $SLUG ${SLUG}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}
          path: NEON_SYNTH_80S/dist/${{ env.SLUG }}.zip

      - name: Release GitHub (macOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neon-synth-80s-2-macos-v2.0.${{ github.run_number }}
          name: NEON SYNTH 80s 2.0 - macOS v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "NEON SYNTH 80s 2.0 for macOS universal (Apple Silicon + Intel): VST3, Audio Unit and standalone app. Not notarized: right-click > Open the installer (see README_FIRST.txt)."
          files: NEON_SYNTH_80S/dist/${{ env.SLUG }}.zip
