name: GFUNK 2027 (Windows)
# Build Windows sur un runner GitHub propre (le PC local est compromis) : VST3 + Standalone, test des presets,
# installateur IExpress (installer/build_installer.ps1), zip identique a celui de Gumroad.
on:
  push:
    branches: [claude/blissful-newton-cxepis]
    paths:
      - '.github/workflows/gfunk-windows.yml'
      - 'GFUNK_2027_VST_Project/Source/**'
      - 'GFUNK_2027_VST_Project/CMakeLists.txt'
      - 'GFUNK_2027_VST_Project/installer/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gfunk-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: GFUNK_2027_VST_Project
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: MSVC x64 + Ninja (the runner image no longer ships the "Visual Studio 17 2022" generator)
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Ninja
        run: pip install ninja

      - name: Configure (MSVC x64, Ninja)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGFUNK_FREE=OFF

      - name: Build VST3, Standalone, the render test and the load test
        run: cmake --build build --config Release --parallel 4 --target GFUNK2027_VST3 GFUNK2027_Standalone GFunkRenderTest GFunkLoadTest

      - name: Load test (host without Common Controls v6, like Ableton Live's plug-in scanner)
        run: |
          ./build/GFunkLoadTest.exe "$((Resolve-Path 'build\GFUNK2027_artefacts\Release\VST3\GFUNK 2027.vst3\Contents\x86_64-win\GFUNK 2027.vst3').Path)"
          if ($LASTEXITCODE -ne 0) { throw "the VST3 does not load without a Common Controls v6 host manifest (Ableton would hide it)" }

      - name: Free edition (100 presets, own plug-in ID) + load test
        run: |
          cmake -B build_free -G Ninja -DCMAKE_BUILD_TYPE=Release -DGFUNK_FREE=ON
          cmake --build build_free --config Release --parallel 4 --target GFUNK2027_VST3 GFUNK2027_Standalone GFunkLoadTest
          $a = 'build_free\GFUNK2027_artefacts\Release'
          ./build_free/GFunkLoadTest.exe "$((Resolve-Path "$a\VST3\GFUNK 2027 Free.vst3\Contents\x86_64-win\GFUNK 2027 Free.vst3").Path)"
          if ($LASTEXITCODE -ne 0) { throw "Free VST3 does not load without a Common Controls v6 host manifest" }
          $bin = Join-Path $env:RUNNER_TEMP 'gfunk_free_bin'; New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item "$a\VST3\GFUNK 2027 Free.vst3" $bin -Recurse
          Copy-Item "$a\Standalone\GFUNK 2027 Free.exe" $bin
          New-Item -ItemType Directory -Force dist\GFUNK_2027_Free_Windows | Out-Null
          ./installer/build_installer.ps1 -Free -Bin $bin -Out "$((Resolve-Path dist).Path)\GFUNK_2027_Free_Windows\GFUNK_2027_Free_Setup.exe"

      - name: Validateur VST3 Steinberg (hote sans Common Controls v6, comme Ableton Live)
        run: |
          ../ALL_PLUGINS/tools/vst3_validator.ps1 -Report dist_validator.txt "build\GFUNK2027_artefacts\Release\VST3\GFUNK 2027.vst3" "build_free\GFUNK2027_artefacts\Release\VST3\GFUNK 2027 Free.vst3"

      - name: Render test (every preset, no NaN / silence / clipping)
        run: |
          ./build/GFunkRenderTest_artefacts/Release/GFunkRenderTest.exe
          ./build/GFunkRenderTest_artefacts/Release/GFunkRenderTest.exe hot

      - name: Installer and zip
        run: |
          $a = 'build\GFUNK2027_artefacts\Release'
          New-Item -ItemType Directory -Force Builds\Windows | Out-Null
          Copy-Item "$a\VST3\GFUNK 2027.vst3" Builds\Windows -Recurse -Force
          Copy-Item "$a\Standalone\GFUNK 2027.exe" Builds\Windows -Force
          New-Item -ItemType Directory -Force dist\GFUNK_2027_Windows | Out-Null
          ./installer/build_installer.ps1 -Out "$((Resolve-Path dist).Path)\GFUNK_2027_Windows\GFUNK_2027_Setup.exe"
          pip install markdown | Out-Null
          python installer/make_guide_html.py dist\GFUNK_2027_Windows\USER_GUIDE.html
          Copy-Item LICENSE.md dist\GFUNK_2027_Windows\LICENSE.txt
          Copy-Item installer\README_FIRST.txt dist\GFUNK_2027_Windows\README_FIRST.txt
          Compress-Archive -Path dist\GFUNK_2027_Windows -DestinationPath dist\GFUNK_2027_Windows.zip -CompressionLevel Optimal
          Copy-Item dist\GFUNK_2027_Windows\USER_GUIDE.html, dist\GFUNK_2027_Windows\LICENSE.txt dist\GFUNK_2027_Free_Windows
          (Get-Content installer\README_FIRST.txt -Raw).Replace('GFUNK_2027_Setup.exe', 'GFUNK_2027_Free_Setup.exe').Replace('GFUNK 2027', 'GFUNK 2027 Free') | Set-Content dist\GFUNK_2027_Free_Windows\README_FIRST.txt
          Compress-Archive -Path dist\GFUNK_2027_Free_Windows -DestinationPath dist\GFUNK_2027_Free_Windows.zip -CompressionLevel Optimal
          Get-FileHash dist\GFUNK_2027_Windows.zip, dist\GFUNK_2027_Windows\GFUNK_2027_Setup.exe, dist\GFUNK_2027_Free_Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Out-File dist\SHA256SUMS.txt
          Copy-Item dist_validator.txt dist\VST3_VALIDATOR_REPORT.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GFUNK_2027_Windows
          path: |
            GFUNK_2027_VST_Project/dist/GFUNK_2027_Windows.zip
            GFUNK_2027_VST_Project/dist/GFUNK_2027_Free_Windows.zip
            GFUNK_2027_VST_Project/dist/SHA256SUMS.txt
            GFUNK_2027_VST_Project/dist/VST3_VALIDATOR_REPORT.txt

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gfunk2027-windows-v2.3.${{ github.run_number }}
          name: GFUNK 2027 - Windows v2.3.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "v2.3 fixes Ableton Live not listing the plug-in (Common Controls v6 manifest in the VST3). Built on a clean GitHub Windows runner: installer (VST3 + standalone), licence, README and user guide. SHA-256 sums in SHA256SUMS.txt."
          files: |
            GFUNK_2027_VST_Project/dist/GFUNK_2027_Windows.zip
            GFUNK_2027_VST_Project/dist/GFUNK_2027_Free_Windows.zip
            GFUNK_2027_VST_Project/dist/SHA256SUMS.txt
            GFUNK_2027_VST_Project/dist/VST3_VALIDATOR_REPORT.txt
