<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { --bg:#0b0b0f; --amber:#f5b544; --orange:#ff7a3d; --violet:#8a5cff; --text:#f1efe8; --dim:#9a978f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:var(--W); height:var(--H); background:var(--bg); font-family:"Inter","DejaVu Sans",sans-serif; color:var(--text); overflow:hidden; }
  .stage { position:relative; width:var(--W); height:var(--H); overflow:hidden;
    background:
      radial-gradient(1100px 700px at 78% 30%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
      radial-gradient(900px 600px at 5% 110%, rgba(138,92,255,.22), transparent 60%),
      linear-gradient(160deg,#15151c 0%,#0b0b0f 60%); }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size:40px 40px; mask-image:radial-gradient(circle at 70% 40%,#000 0,transparent 75%); }
  .brand { position:absolute; display:flex; align-items:center; gap:calc(var(--u)*10); font-weight:800; letter-spacing:calc(var(--u)*3); color:var(--amber); font-size:calc(var(--u)*17); }
  .brand .bn { display:flex; flex-direction:column; line-height:1.05; font-size:calc(var(--u)*28); letter-spacing:calc(var(--u)*5); }
  .brand .bn small { font-size:calc(var(--u)*11); letter-spacing:calc(var(--u)*3); color:var(--dim); font-weight:700; margin-top:calc(var(--u)*3); }
  .brand img { height:calc(var(--u)*46); width:auto; border-radius:50%; }
  .shot { position:absolute; border-radius:calc(var(--u)*16); overflow:hidden; box-shadow:0 calc(var(--u)*30) calc(var(--u)*70) rgba(0,0,0,.65), 0 0 0 calc(var(--u)*2) rgba(245,181,68,.35), 0 0 calc(var(--u)*90) color-mix(in srgb, var(--accent) 35%, transparent); background:#000; }
  .shot img { display:block; width:100%; height:auto; object-fit:contain; }
  h1 { position:absolute; font-weight:900; line-height:.98; letter-spacing:-.02em; text-transform:uppercase;
    background:linear-gradient(180deg,#fff 0%, #ffe3ad 45%, var(--amber) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 calc(var(--u)*6) calc(var(--u)*18) rgba(0,0,0,.6)); }
  .tag { position:absolute; color:var(--text); font-weight:600; line-height:1.25; }
  .tag b { color:var(--amber); }
  .badges { position:absolute; display:flex; flex-wrap:wrap; gap:calc(var(--u)*8); }
  .badge { font-weight:700; font-size:calc(var(--u)*14); padding:calc(var(--u)*7) calc(var(--u)*13); border-radius:999px; background:rgba(255,255,255,.07); border:1px solid rgba(245,181,68,.45); color:var(--text); letter-spacing:.04em; text-transform:uppercase; }
  .badge.hot { background:linear-gradient(90deg,var(--amber),var(--orange)); color:#1a1306; border:0; }
  .kind { position:absolute; font-weight:800; letter-spacing:.22em; color:var(--accent); text-transform:uppercase; }
  .foot { position:absolute; color:var(--dim); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:calc(var(--u)*12); }

  /* ---- 600x600 thumbnail ---- */
  body.thumb { --W:600px; --H:600px; --u:1px; }
  .thumb .brand { left:30px; top:22px; font-size:15px; }
  .thumb .brand img { height:36px; }
  .thumb .kind { display:none; }
  .thumb .tag { display:none; }
  .thumb .shot { left:34px; width:532px; top:78px; }
  .thumb h1 { left:34px; top:486px; width:532px; font-size:40px !important; white-space:nowrap; }
  .thumb .badges { left:34px; bottom:16px; }
  .thumb .foot { display:none; }

  /* ---- 1280x720 cover ---- */
  body.cover { --W:1280px; --H:720px; --u:1.25px; }
  .cover .brand { left:64px; top:52px; }
  .cover .kind { left:68px; top:140px; font-size:18px; }
  .cover h1 { left:64px; top:176px; width:520px; font-size:var(--fs,92px); }
  .cover .tag { left:68px; top:var(--tagTop,430px); width:500px; font-size:27px; }
  .cover .shot { left:640px; top:148px; width:576px; }
  .cover .badges { left:64px; bottom:56px; width:540px; }
  .cover .foot { right:64px; bottom:30px; }
</style></head>
<body class="{{MODE}}">
<div class="stage" style="--accent:{{ACCENT}}">
  <div class="grid"></div>
  <div class="brand">{{LOGO}}<span class="bn">{{BRAND}}<small>DJBILBOX BEATS</small></span></div>
  <div class="kind">{{KIND}}</div>
  <h1 style="--fs:{{FS}}">{{NAME}}</h1>
  <div class="tag">{{TAGLINE}}</div>
  <div class="shot"><img src="{{SHOT}}"></div>
  <div class="badges">{{BADGES}}</div>
  <div class="foot">{{FOOT}}</div>
</div>
</body></html>
